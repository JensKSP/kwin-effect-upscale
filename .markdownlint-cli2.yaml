config:
  # Prose here is wrapped at 80 by hand, but tables and links are not worth
  # breaking over, and KDE has no line length rule for Markdown.
  MD013: false
  # Every file starts with an SPDX comment, not with a heading.
  MD041: false
  # The same heading text under different parents is fine.
  MD024:
    siblings_only: true
globs:
  - "**/*.md"
ignores:
  - "LICENSES/**"
  - "build/**"
  # A pre-commit cache can land here rather than under build/, and the hook
  # repositories inside it carry their own Markdown and their own
  # markdownlint configuration. Linting someone else's fixtures fails on a
  # config file this project never wrote, which reads as our documents being
  # broken. Ignored for the same reason build/ is: it is not ours.
  - ".cache/**"
