#
# ruff checks four rules out of the box, which is next to nothing. Everything is
# switched on here and switched off again one rule at a time, with a reason, so
# that a rule is never off merely because nobody chose it.

line-length = 100
target-version = "py311"

[lint]
select = ["ALL"]
ignore = [
    # The formatter owns these; leaving them on makes the two fight.
    "COM812",
    "ISC001",
    # Conflicting docstring conventions: one of each pair has to go.
    "D203",
    "D213",
    # These are command line tools. Printing is how they talk.
    "T201",
]

[lint.flake8-copyright]
# This repository is REUSE compliant, so a copyright notice is an SPDX tag.
# ruff looks for the word "Copyright" by default and would never find one.
notice-rgx = "(?i)SPDX-FileCopyrightText:"

[lint.per-file-ignores]
# A checker prints what it found and exits; that is not a library API.
#
# These tools drive Git, CMake and the schema validator. Every argument list is
# written here as a literal, never taken from user input, and the tools are
# looked up on PATH on purpose: the container, the CI runner and a developer's
# machine each have their own. That is what S603 and S607 warn about, and
# hard-coding an absolute path to Git instead would be worse.
"tools/*.py" = ["INP001", "S603", "S607"]
# The test hook runs `unittest discover`, so unittest is the style on purpose,
# and a test asserting its own preconditions is not a security finding.
"tools/test_*.py" = ["PT009", "PT027", "S101"]

[format]
docstring-code-format = true
