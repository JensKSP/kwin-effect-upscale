#
# The one place checks are configured. Agents and CI both run
#
#     pre-commit run --all-files
#     pre-commit run --all-files --hook-stage pre-push
#
# and there is no second list of linters anywhere. Hook versions are pinned so
# that a check cannot start failing because an upstream tag moved.
#
# Two rules decide what may touch src/plugins/upscale/:
#   - a formatter runs there only if its output is what KWin itself writes, and
#   - nothing adds a file or a marker KWin does not have.
# clang-format qualifies, because .clang-format is KWin's own file. gersemi
# does not: it rewrites KWin's CMake style (it collapses source lists onto one
# line and breaks `target_link_libraries(target PRIVATE` apart), so it is kept
# to the project shell outside the plugin folder.

exclude: ^(LICENSES/|po/|containers/.*\.patch$)

repos:
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        types: [file]
        files: (^|/)(Containerfile|Dockerfile)(\..*)?$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      # A staged scan alone would see nothing in a fresh CI checkout.
      - id: gitleaks
        alias: gitleaks-history
        name: Secrets in complete Git history
        entry: gitleaks git --redact --log-opts=--all
        stages: [pre-push]
        always_run: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [--configfile, .bandit.yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=256]
      - id: check-json
      - id: check-yaml
        # .clang-format is a multi-document YAML file: one document per language.
        args: [--allow-multiple-documents]

  # clang-format 19 is what Debian Trixie ships, and the minimum supported
  # environment decides. A different major version formats differently, so the
  # hook would disagree with the container and with CI.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.1
    hooks:
      - id: gersemi
        exclude: ^src/plugins/

  # Static checks also cover the plugin's CMake files. Formatting remains with
  # gersemi outside the plugin and with KWin's conventions inside it.
  - repo: local
    hooks:
      - id: cmake-lint
        name: CMake static checks
        entry: cmake-lint
        language: python
        # cmakelang reads .cmake-lint.yaml through PyYAML, which it does not
        # depend on. Without this the hook dies in an internal traceback and
        # never lints anything.
        additional_dependencies: [cmakelang==0.6.13, pyyaml==6.0.2]
        files: (^|/)(CMakeLists\.txt|[^/]+\.cmake)(\.in)?$
        args: [--config-files, .cmake-lint.yaml, --]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ruff's flake8-annotations rules require an annotation on every argument and
  # return; only a type checker says whether those annotations are true. Both
  # halves are needed for typed Python, so mypy runs in strict mode: no
  # implicit Any, no untyped call, no unchecked function body.
  #
  # A local hook rather than the mypy mirror, so the version is pinned in the
  # same place as everything else here. It is handed the directory rather than
  # the changed files, because checking one file of the tools in isolation
  # cannot resolve the module its siblings import.
  - repo: local
    hooks:
      - id: mypy
        name: strict type checking
        entry: mypy --strict --python-version=3.11 tools
        language: python
        additional_dependencies: [mypy==2.3.1]
        files: ^tools/.*\.py$
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # The workflows are what publishes packages; a typo in one of them is found
  # here rather than by a release that does not happen.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # A whole-tree scan, and the slowest hook here. It only breaks when a file is
  # added without an SPDX header, so it runs at push rather than on every commit.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      # What is being committed, which is all a commit can introduce.
      - id: no-ai-artifacts
        name: no agent leftovers in what is being committed
        entry: tools/check-no-ai-artifacts.py
        language: script
        pass_filenames: false
        always_run: true

      # And the whole tree before it leaves the machine, because a commit hook
      # can be skipped with --no-verify and this rule is not negotiable.
      - id: no-ai-artifacts-all
        name: no agent leftovers anywhere in the tree
        entry: tools/check-no-ai-artifacts.py --all
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Spelled out as file names rather than as pre-commit's type tags,
      # because identify gives .glsl, .frag, .vert and .cpp.in no tags at all
      # and a hook that is handed no files reports success.
      - id: file-size
        name: no oversized source files
        entry: tools/check-file-size.py
        language: script
        files: >-
          (?x)
          (^|/)CMakeLists\.txt(\.in)?$
          |\.(c|cc|cpp|cxx|h|hh|hpp|glsl|frag|vert|cmake|py|sh|bash|yml|yaml|toml|ini)(\.in)?$

      # At push time, not at commit time. The linters look at what changed and
      # take a moment; the regression tests build things in temporary
      # directories and need the whole tree, which is exactly what a commit of
      # part of the tree does not offer. Installed with:
      #     pre-commit install --hook-type pre-commit --hook-type pre-push
      - id: tooling-tests
        name: Build and checker regression tests
        entry: python3 -B -m unittest discover -s tools
        language: system
        pass_filenames: false
        # Native file filtering skips these for documentation-only changes.
        # --all-files still runs the complete suite, including in full CI.
        files: ^(tools/|cmake/|src/|autotests/|debian/|containers/|\.github/.*\.ya?ml$|CMakeLists\.txt$|\.pre-commit-config\.yaml$)
        stages: [pre-push]

      # Needs the configured KWin build and Mesa, like clang-tidy. The build
      # jobs invoke this stage after compiling; ordinary commits need neither.
      - id: upscale-render-tests
        name: FSR rendering and colour regression tests
        entry: python3 -B tools/run-render-tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: upscale-coverage
        name: Plugin C++ line coverage at least 90 percent
        entry: python3 -B tools/check-coverage.py
        language: python
        additional_dependencies: [gcovr==8.6]
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: upscale-fuzz
        name: Resolution policy fuzzing
        entry: python3 -B tools/run-fuzz-tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      # Needs the pinned CodeQL command line, which the entry point fetches
      # once into build/. The scheduled scan runs this same check; there is no
      # separate analysis configured only for CI.
      - id: upscale-codeql
        name: CodeQL security analysis
        entry: python3 -B tools/run-codeql.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: debian-package-lint
        name: Debian package policy
        entry: lintian --fail-on error,warning
        language: system
        types: [file]
        files: '\.(deb|ddeb)$'
        stages: [manual]
