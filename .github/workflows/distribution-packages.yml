# Fedora, openSUSE and Arch packages. The nightly calls this; nothing earlier
# does. These distributions ship a KWin well ahead of the supported minimum and
# two of them roll, so a break here is not the author of whatever was pushed to
# answer for, which is exactly what the nightly level is for.

name: Distribution packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: fedora
            base-image: docker.io/library/fedora:43
          - distribution: opensuse
            base-image: docker.io/opensuse/tumbleweed
          - distribution: arch
            base-image: docker.io/library/archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/environment
        with:
          environment: ${{ matrix.distribution }}
          base-image: ${{ matrix.base-image }}
      - name: Build the package
        env:
          VERSION: ${{ inputs.version }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            upscale-check:local \
            python3 -B tools/build-distribution-packages.py "$DISTRIBUTION" "$VERSION"
      # In a clean container of the distribution, not the build one: the build
      # image has every development package installed, so a runtime dependency
      # the package forgot to declare would load there and nowhere else.
      - name: Install and load the shipped plugin in a clean distribution
        env:
          BASE_IMAGE: ${{ matrix.base-image }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          case "$DISTRIBUTION" in
            fedora)
              pattern='build/artifacts/*.rpm'
              prepare='dnf install -y --setopt=install_weak_deps=False python3'
              ;;
            opensuse)
              pattern='build/artifacts/*.rpm'
              prepare='zypper -n --gpg-auto-import-keys refresh && zypper -n install --no-recommends python3'
              ;;
            arch)
              pattern='build/artifacts/*.pkg.tar.zst'
              prepare='pacman -Sy --noconfirm python'
              ;;
          esac
          # The one package that is not a debug sidecar, chosen by glob rather
          # than by parsing ls, which cannot survive an unusual file name.
          package=
          for candidate in $pattern; do
            case "$candidate" in
              *-debuginfo-*|*-debugsource-*|*-debug-*) continue ;;
            esac
            package="$candidate"
            break
          done
          test -n "$package"
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" -w /src \
            "$BASE_IMAGE" sh -ec "
              $prepare >/dev/null
              python3 -B tools/test-installed-distribution-package.py \"\$1\" \"/src/\$2\"
            " sh "$DISTRIBUTION" "$package"
      - name: Make artifacts readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deliverable-${{ matrix.distribution }}
          path: build/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-${{ matrix.distribution }}
          path: |
            build/packages/*/BUILD/*/build/CMakeFiles/CMakeConfigureLog.yaml
            build/packages/*/SPECS/*.spec
          if-no-files-found: ignore
          retention-days: 14
