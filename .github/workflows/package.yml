name: Package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

      smoke:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deb:
    name: ${{ matrix.distribution }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(inputs.smoke && '["trixie"]' || '["trixie", "resolute"]') }}
        architecture: ${{ fromJSON(inputs.smoke && '["amd64"]' || '["amd64", "arm64"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/environment
        with:
          environment: package
          base-image: ${{ matrix.distribution == 'trixie' && 'docker.io/library/debian:trixie' || 'docker.io/library/ubuntu:26.04' }}
      - name: Build, test and compare two clean builds
        env:
          VERSION: ${{ inputs.version }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            -e GITHUB_REF_NAME upscale-check:local \
            python3 -B tools/build-packages.py "$VERSION" "$DISTRIBUTION"
      - name: Install and load the shipped plugin in a clean distribution
        env:
          BASE_IMAGE: ${{ matrix.distribution == 'trixie' && 'docker.io/library/debian:trixie' || 'docker.io/library/ubuntu:26.04' }}
          VERSION: ${{ inputs.version }}
          DISTRIBUTION: ${{ matrix.distribution }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          package="/src/build/artifacts/kwin-effect-upscale_${VERSION}~${DISTRIBUTION}_${ARCHITECTURE}.deb"
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" -w /src \
            -e DEBIAN_FRONTEND=noninteractive "$BASE_IMAGE" sh -ec '
              apt-get update
              apt-get install --no-install-recommends -y python3
              python3 -B tools/test-installed-package.py "$1" \
                build/packages/first/source/build/bin/upscale_package_test
            ' sh "$package"
      - name: Make artifacts readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deliverable-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: build/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-package-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: |
            build/packages/*/build.log
            build/packages/*/source/build/Testing/
            build/packages/*/*.deb
            build/packages/*/*.ddeb
          if-no-files-found: ignore
          retention-days: 14

  tarball:
    name: Source archive build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/environment
      - name: Create, extract, build and test the source archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            upscale-check:local python3 -B tools/build-source.py "$VERSION"
      - name: Make artifacts readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deliverable-source
          path: build/artifacts/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-source
          path: build/extracted/*/build/Testing/
          if-no-files-found: ignore
