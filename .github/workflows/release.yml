# A release is a tag. Pushing v0.1.0 builds the packages and the tarball and
# publishes them; nothing is uploaded by hand.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the version in the build is a release nobody
      # can reason about afterwards, so it fails here rather than shipping.
      - id: check
        run: |
          tag=${GITHUB_REF_NAME#v}
          project=$(grep -oP 'project\(kwin-effect-upscale VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          changelog=$(dpkg-parsechangelog -S Version -l debian/changelog)
          echo "tag=$tag project=$project changelog=$changelog"
          if [ -z "$project" ]; then
            echo "::error::could not read the version out of CMakeLists.txt"
            exit 1
          fi
          if [ "$tag" != "$project" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project(VERSION $project)"
            exit 1
          fi
          if [ "$tag" != "$changelog" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog $changelog"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Build
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: release

  publish:
    name: Publish the release
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "kwin-effect-upscale ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
