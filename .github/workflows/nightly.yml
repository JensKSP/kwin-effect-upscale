# One rolling pre-release called "nightly", rebuilt from master each night and
# only when master actually moved. Its version names the commit it came from, so
# a downloaded package can always be traced back to a commit.

name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      verify-only:
        description: Build and attest a candidate without changing the nightly release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  portability:
    if: github.event_name == 'workflow_dispatch' && inputs.verify-only
    uses: ./.github/workflows/portability.yml

  quality:
    uses: ./.github/workflows/ci.yml
    with:
      fuzz-seconds: 600

  version:
    name: Work out whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        env:
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify-only }}
        run: |
          if [ "$VERIFY_ONLY" != true ]; then
            test "$GITHUB_REF" = refs/heads/master
          fi
          python3 -B tools/release-version.py snapshot >> "$GITHUB_OUTPUT"

          # A nightly that is identical to yesterday's is noise. A manual run
          # builds anyway, because that is what asking for it means.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse HEAD)" != "$(git rev-parse --verify "refs/tags/nightly^{commit}" 2>/dev/null || true)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "master has not moved since the last nightly" >> "$GITHUB_STEP_SUMMARY"
          fi

  # KWin master is a moving target, so a break here is usually upstream's and
  # not the author's of whatever was pushed. It costs a pull request nothing and
  # is still caught within a day. It does not gate the packages: a nightly of
  # the supported platforms is worth publishing even when master has moved on.
  kwin-master:
    name: KDE neon unstable (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check
        with:
          environment: neon-unstable
          mode: ${{ matrix.compiler }}

  package:
    name: Build
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: nightly

  publish:
    needs: [version, quality, package]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: nightly
      publish: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify-only }}
