# One rolling pre-release called "nightly", rebuilt from master each night and
# only when master actually moved. Its version names the commit it came from, so
# a downloaded package can always be traced back to a commit.

name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      verify-only:
        description: Build and attest a candidate without changing the nightly release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The commit's own CI run, from its push or its pull request, stands for the
  # nightly's check leg when it finished green; running it again cost a third
  # of the nightly. Only a commit without a finished run has CI run here, and
  # one whose CI failed stops the nightly.
  ci:
    name: Find the commit's CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      state: ${{ steps.find.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/ci-conclusion.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  quality:
    needs: ci
    if: needs.ci.outputs.state == 'missing'
    uses: ./.github/workflows/ci.yml
    with:
      fuzz-seconds: 600

  # The nightly's longer fuzzing is its own: the pull request's CI fuzzes for a
  # minute. It runs with the instrumented builds where CI is not run here.
  instrumented:
    needs: ci
    if: needs.ci.outputs.state == 'passed'
    uses: ./.github/workflows/run-instrumented-tests.yml
    with:
      fuzz-seconds: 600

  version:
    name: Work out whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        env:
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify-only }}
        run: |
          if [ "$VERIFY_ONLY" != true ]; then
            test "$GITHUB_REF" = refs/heads/master
          fi
          python3 -B tools/release-version.py snapshot >> "$GITHUB_OUTPUT"

          # A nightly that is identical to yesterday's is noise. A manual run
          # builds anyway, because that is what asking for it means.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse HEAD)" != "$(git rev-parse --verify "refs/tags/nightly^{commit}" 2>/dev/null || true)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "master has not moved since the last nightly" >> "$GITHUB_STEP_SUMMARY"
          fi

  # KWin master is a moving target, so a break here is usually upstream's and
  # not the author's of whatever was pushed. It costs a pull request nothing and
  # is still caught within a day. It does not gate the packages: a nightly of
  # the supported platforms is worth publishing even when master has moved on.
  kwin-master:
    name: Build on KDE neon unstable (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-checks
        with:
          environment: neon-unstable
          mode: ${{ matrix.compiler }}
          # Built, not tested: the supported target is where a failing test
          # is this repository's to answer for.
          build-only: true

  # The checks on the newest KWin a package ships for, which tools/ci_targets.py
  # names. Pull requests check Trixie's KWin alone and the package jobs build
  # without tests, so this is the one place the suite, the X11 sessions above
  # all, meets that KWin on a hosted runner. Like KWin master it does not gate
  # the packages: a night's release of the supported platforms should not wait
  # on a slower KWin's sessions, and a failure here is still heard within a day.
  checked-targets:
    name: Select checked targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        run: echo "matrix=$(python3 -B tools/ci_targets.py --checked)" >> "$GITHUB_OUTPUT"

  checked:
    name: Run ${{ matrix.label }} ${{ matrix.architecture }} Checks (gcc)
    needs: checked-targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checked-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-checks
        with:
          environment: ${{ matrix.container }}
          base-image: ${{ matrix.image }}
          mode: gcc

  # Every target: Debian, Kubuntu, Fedora, openSUSE, Arch and FreeBSD, on every
  # architecture each is built for. Nightly and nowhere earlier for most of
  # them - their KWin is well ahead of the supported minimum and three of them
  # roll, so a break is not the author of whatever was pushed to answer for.
  # Unlike kwin-master above this does gate publication, because a release
  # that silently lost a distribution is worse than one that is late.
  build:
    name: Build
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test-packages.yml

  # Nothing is published that was not installed and tested first.
  publish:
    name: Release
    needs: [version, quality, instrumented, test]
    # The check leg is one of the two, the other skipped.
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && needs.test.result == 'success'
      && (needs.quality.result == 'success' || needs.instrumented.result == 'success') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-assets.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: nightly
      publish: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify-only }}
