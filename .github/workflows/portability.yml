name: BSD portability

# The nightly calls this every night, so it carries no schedule of its own.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: bsd-portability
  cancel-in-progress: false

jobs:
  freebsd:
    name: FreeBSD Clang
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1
        with:
          release: '15.0'
          prepare: pkg install -y python3 git
          run: |
            set -eu
            pkg install -y $(python3 -B tools/distribution-packages.py freebsd)
            cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DBUILD_TESTING=ON
            cmake --build build
            CTEST_PARALLEL_LEVEL="${CTEST_PARALLEL_LEVEL-}" \
              ctest --test-dir build --output-on-failure --no-tests=error \
              --timeout 120 -R '^upscale-(resolution|config)$'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-freebsd
          path: |
            build/Testing/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
