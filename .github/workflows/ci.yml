name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      fuzz-seconds:
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.changed.outputs.packaging }}
      version: ${{ steps.changed.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}"; then
            tools/check-commit-trailers.py "$BASE..HEAD"
          else
            tools/check-commit-trailers.py HEAD
          fi

      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/release-version.py snapshot >> "$GITHUB_OUTPUT"
          changed=''
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$BASE" HEAD)
          fi
          if grep -Eq '^(debian/|containers/|cmake/|CMakeLists.txt|autotests/|tools/|\.github/)' <<< "$changed"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Trixie (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [lint, gcc, clang, tidy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check
        with:
          mode: ${{ matrix.mode }}

  instrumentation:
    uses: ./.github/workflows/instrumentation.yml
    with:
      fuzz-seconds: ${{ inputs.fuzz-seconds || 60 }}

  package-smoke:
    needs: commits
    if: github.event_name == 'pull_request' && needs.commits.outputs.packaging == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.commits.outputs.version }}
      channel: check
      smoke: true

  quality:
    name: Quality gate
    if: always()
    needs: [commits, checks, instrumentation, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all supported-platform checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -B tools/quality_gate.py
