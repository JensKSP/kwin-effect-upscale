name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      fuzz-seconds:
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Check Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changed.outputs.build }}
      modes: ${{ steps.changed.outputs.modes }}
      packaging: ${{ steps.changed.outputs.packaging }}
      version: ${{ steps.changed.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}"; then
            tools/check-commit-trailers.py "$BASE..HEAD"
          else
            tools/check-commit-trailers.py HEAD
          fi

      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -B tools/release-version.py snapshot >> "$GITHUB_OUTPUT"
          python3 -B tools/ci_scope.py >> "$GITHUB_OUTPUT"

  checks:
    name: Run Trixie Checks (${{ matrix.mode }})
    needs: commits
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.commits.outputs.modes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/run-checks
        with:
          mode: ${{ matrix.mode }}
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  # The packages ship for arm64, so a pull request has to compile for arm64.
  # One GCC build with warnings as errors, not the whole mode matrix: the
  # architecture is what is being checked here, not the toolchain.
  arm64:
    name: Run Trixie arm64 Checks (gcc)
    needs: commits
    if: needs.commits.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/run-checks
        with:
          mode: gcc
          base: ${{ github.event.pull_request.base.sha || github.event.before }}

  instrumentation:
    name: Run
    needs: commits
    if: needs.commits.outputs.build == 'true'
    uses: ./.github/workflows/run-instrumented-tests.yml
    with:
      fuzz-seconds: ${{ inputs.fuzz-seconds || 60 }}

  # The same two stages the nightly and a release run, with one target in
  # them. A pull request that cannot build and install a package has broken
  # the packaging, and finding that out here costs one target rather than ten.
  package:
    name: Build
    needs: commits
    if: github.event_name == 'pull_request' && needs.commits.outputs.packaging == 'true'
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.commits.outputs.version }}
      targets: trixie
      architectures: amd64
      source-archive: false

  package-test:
    name: Test
    needs: package
    uses: ./.github/workflows/test-packages.yml
    with:
      targets: trixie
      architectures: amd64

  quality:
    name: Quality gate
    if: always()
    needs: [commits, checks, arm64, instrumentation, package, package-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all supported-platform checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -B tools/quality_gate.py
