name: Review approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [Review event]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Serialize status writers. Each invocation reads current GitHub metadata rather
# than an old event's verdict; coalescing queued events cannot lose an approval.
concurrency:
  group: review-approval
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh approval statuses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both privileged events execute only the trusted default branch.
          # Never check out the PR head or consume review-event artifacts.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify current CodeRabbit approvals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/review_approval.py --publish
