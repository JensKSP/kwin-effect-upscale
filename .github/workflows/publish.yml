name: Publish verified artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      publish:
        description: Publish a release after verifying provenance
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deliverable-*
          path: build/release
          merge-multiple: true
      - name: Validate inventory and create checksums
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -B tools/prepare-release.py "$VERSION" build/release
      - name: Attest the exact deliverables and checksum manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/release/*
      - name: Attach the verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" build/release/provenance.sigstore.json
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify build/release/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml"
      - name: Publish through a draft
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 -B tools/publish-release.py "$VERSION" "$CHANNEL" build/release
      - name: Retain the verified release candidate
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-candidate
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
