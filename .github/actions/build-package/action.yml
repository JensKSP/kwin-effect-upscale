name: Build package
description: Build one target's package in its maintained container image

# One job's worth of work and no policy: which targets exist, which of them is
# built twice and what each is called is tools/ci_targets.py's to say. This
# action receives one row of that table and builds it.
inputs:
  target:
    description: Target identifier from tools/ci_targets.py
    required: true
  version:
    description: Package version to build
    required: true
  container:
    description: Directory under containers/ holding the build image
    required: true
  image:
    description: Base image the build container is built from
    required: true
  architecture:
    description: Architecture this runner builds for
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/build-container-image
      with:
        environment: ${{ inputs.container }}
        base-image: ${{ inputs.image }}

    - name: Build the package
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
          -e GITHUB_REF_NAME upscale-check:local \
          python3 -B tools/build-package.py "$TARGET" "$VERSION"

    - name: Make artifacts readable
      if: always()
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" build

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: deliverable-${{ inputs.target }}-${{ inputs.architecture }}
        path: build/artifacts/*
        if-no-files-found: error

    # The binaries that test the package rather than the tree. They are built
    # by the package build, so the test stage installs and runs them instead of
    # compiling anything a second time.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package-tests-${{ inputs.target }}-${{ inputs.architecture }}
        path: build/packages/first/source/build/bin/upscale_*_test
        if-no-files-found: ignore
        retention-days: 14

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: reports-build-${{ inputs.target }}-${{ inputs.architecture }}
        path: |
          build/packages/*/build.log
          build/packages/*/source/build/CMakeFiles/CMakeConfigureLog.yaml
          build/packages/*/SPECS/*.spec
          build/packages/*/+MANIFEST
        if-no-files-found: ignore
        retention-days: 14
