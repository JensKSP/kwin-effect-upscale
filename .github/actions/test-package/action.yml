name: Test package
description: Install one built package in a clean environment and test it there

# The package comes from the build stage as an artifact, so nothing is compiled
# here. The environment is a clean image of the distribution with an
# interpreter and nothing else: everything the plugin needs at runtime has to
# come from the package, which is what this stage is for.
inputs:
  target:
    description: Target identifier from tools/ci_targets.py
    required: true
  family:
    description: Packaging family, which decides whether a probe was built
    required: true
  image:
    description: Clean image of the distribution
    required: true
  architecture:
    description: Architecture the package was built for
    required: true
  bootstrap:
    description: Command that installs an interpreter in the clean image
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: deliverable-${{ inputs.target }}-${{ inputs.architecture }}
        path: build/artifacts

    # Only the Debian family builds the test binaries, because only it builds
    # with testing enabled. An artifact keeps its content and not its mode, so
    # the executable bit is restored before anything tries to run them.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: inputs.family == 'deb'
      with:
        name: package-tests-${{ inputs.target }}-${{ inputs.architecture }}
        path: build/tests
    - name: Select the package and restore the test binaries
      id: select
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        FAMILY: ${{ inputs.family }}
      run: |
        chmod -R +x build/tests 2>/dev/null || true
        package=$(python3 -B tools/test-package.py "$TARGET" build/artifacts --select)
        echo "package=$package" >> "$GITHUB_OUTPUT"
        if [ "$FAMILY" = deb ]; then
          echo "probe=build/tests/upscale_package_test" >> "$GITHUB_OUTPUT"
        else
          echo "probe=" >> "$GITHUB_OUTPUT"
        fi

    - name: Install and load the package in a clean distribution
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TARGET: ${{ inputs.target }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
        PACKAGE: ${{ steps.select.outputs.package }}
        PROBE: ${{ steps.select.outputs.probe }}
      run: |
        docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" -w /src \
          -e DEBIAN_FRONTEND=noninteractive -e TARGET -e BOOTSTRAP -e PACKAGE -e PROBE \
          "$IMAGE" sh -ec '
            eval "$BOOTSTRAP" >/dev/null
            set -- "$TARGET" "$PACKAGE"
            if [ -n "$PROBE" ]; then
              set -- "$@" --probe "$PROBE"
            fi
            python3 -B tools/test-package.py "$@"
          '

    - name: Make reports readable
      if: always()
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" build || true

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: reports-test-${{ inputs.target }}-${{ inputs.architecture }}
        path: build/*.log
        if-no-files-found: ignore
        retention-days: 14
