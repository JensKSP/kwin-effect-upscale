name: Run checks
description: Run one check group from tools/run-checks.py in its container image
inputs:
  mode:
    description: Check group selected by tools/run-checks.py
    required: true
  base:
    description: Base commit for native pre-commit file filtering in docs mode
    default: ''
  environment:
    description: Container directory under containers
    default: trixie
  fuzz-seconds:
    description: Time budget for the fuzzing job
    default: '60'
  build-only:
    description: Compile and stop, for a platform that is built but not tested
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/build-container-image
      with:
        environment: ${{ inputs.environment }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/pre-commit
          build/ccache
          build/address/fuzz-corpus
        key: checks-${{ runner.arch }}-${{ inputs.environment }}-${{ inputs.mode == 'docs' && 'lint' || inputs.mode }}-${{ hashFiles('.pre-commit-config.yaml') }}-${{ github.sha }}
        restore-keys: |
          checks-${{ runner.arch }}-${{ inputs.environment }}-${{ inputs.mode == 'docs' && 'lint' || inputs.mode }}-${{ hashFiles('.pre-commit-config.yaml') }}-
    - name: Run checks
      shell: bash
      env:
        CHECK_MODE: ${{ inputs.mode }}
        UPSCALE_CHECK_BASE: ${{ inputs.base }}
        UPSCALE_FUZZ_SECONDS: ${{ inputs.fuzz-seconds }}
        BUILD_ONLY: ${{ inputs.build-only }}
      run: |
        options=()
        if [ "$CHECK_MODE" = thread ]; then
          options+=(--security-opt seccomp=unconfined)
        fi
        arguments=("$CHECK_MODE")
        if [ "$BUILD_ONLY" = true ]; then
          arguments+=(--build-only)
        fi
        mkdir -p build
        docker run --rm "${options[@]}" \
          -v "$GITHUB_WORKSPACE:/src" -w /src \
          -e UPSCALE_FUZZ_SECONDS -e UPSCALE_CHECK_BASE -e GITHUB_REF_NAME -e GITHUB_HEAD_REF \
          upscale-check:local python3 -B tools/run-checks.py "${arguments[@]}" \
          2>&1 | tee "build/$CHECK_MODE.log"
    - name: Make reports and caches readable by the runner
      if: always()
      shell: bash
      run: |
        if [ -d build ]; then
          sudo chown -R "$(id -u):$(id -g)" build
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        # The architecture is part of the name because the same environment and
        # mode now run on two of them, and two uploads cannot share a name.
        name: reports-${{ inputs.environment }}-${{ runner.arch }}-${{ inputs.mode }}
        path: |
          build/${{ inputs.mode }}.log
          build/${{ inputs.mode }}/runtime-tests.xml
          build/${{ inputs.mode }}/Testing/
          build/${{ inputs.mode }}/CMakeFiles/CMakeConfigureLog.yaml
          build/${{ inputs.mode }}/coverage/
          build/${{ inputs.mode }}/fuzz-artifacts/
          build/${{ inputs.mode }}/fuzz-corpus/
          build/${{ inputs.mode }}/fuzz-*.log
          build/pre-commit/pre-commit.log
        if-no-files-found: ignore
        retention-days: 14
